# =============================================================================
# melange.yaml — APK Package Build Spec
#
# Builds the BlanketOps Environments Controller binary as a Wolfi APK.
# Consumed by apko.yaml to assemble the final OCI image.
#
# Version:
#   Set to 0.0.0 as a placeholder. The apko.yml workflow patches this to the
#   actual release version before the build via sed. The committed file is
#   never modified — only the runner copy is patched.
#
# Private module access:
#   All three sed patches are applied by apko.yml before the build:
#     1. version:     0.0.0 → actual release version
#     2. checkout URL: HTTPS → HTTPS+PAT (for controller repo clone in bwrap)
#     3. MELANGE_PAT: placeholder → actual PAT (for go mod download of private
#        deps inside bwrap — SSH is not available in the bubblewrap sandbox)
#
# Tag format:
#   v${{package.version}} — the 'v' prefix matches actual git tags (v0.6.0).
#   After version patching: package.version = 0.6.0 → tag = v0.6.0.
# =============================================================================

package:
  name: blanketops-environments-controller
  version: 0.0.0
  epoch: 0
  description: "BlanketOps Environments Kubernetes Controller"
  target-architecture:
    - x86_64
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime: []
  checks:
    disabled:
      - usrlocal
      - setuidgid
update:
  enabled: false

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - git
      - openssh-client
  environment:
    GOPRIVATE: github.com/ntlaletsi70/*
    GONOSUMDB: github.com/ntlaletsi70/*
    GOPROXY: direct
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ntlaletsi70/blanketops-environments-controller
      tag: v${{package.version}}
      expected-commit: ""

  # Rewrite HTTPS to HTTPS+PAT for all private module fetches inside bwrap.
  # SSH is not available in the bubblewrap sandbox — HTTPS+PAT is the only
  # option for go mod download of private deps (blanketops-environments-api etc).
  # MELANGE_PAT is replaced with the actual PAT by apko.yml before the build.
  - name: Configure git for private modules
    runs: |
      git config --global url."https://MELANGE_PAT@github.com/ntlaletsi70/".insteadOf "https://github.com/ntlaletsi70/"

  - uses: go/build
    with:
      packages: ./cmd
      output: manager
      ldflags: -s -w

  - uses: strip
