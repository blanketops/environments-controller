package:
  name: blanketops-environments-controller
  version: 0.0.9
  epoch: 0
  description: "BlanketOps Environments Kubernetes Controller"
  target-architecture:
  - x86_64
  copyright:
  - license: Apache-2.0
  dependencies:
    runtime: []
  checks:
    disabled:
    - usrlocal
    - setuidgid
update:
  enabled: false

environment:
  contents:
    repositories:
    - https://packages.wolfi.dev/os
    keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
    - busybox
    - ca-certificates-bundle
    - go
    - git
    - openssh-client
  environment:
    GOPRIVATE: github.com/ntlaletsi70/*
    GONOSUMDB: github.com/ntlaletsi70/*
    GOPROXY: direct
    CGO_ENABLED: "0"
    GOFLAGS: "-mod=vendor"

pipeline:
- uses: go/build
  with:
    packages: ./cmd
    output: manager
    ldflags: -s -w

- uses: strip
