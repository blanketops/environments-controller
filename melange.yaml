package:
  name: blanketops-environments-controller
  version: 0.0.0
  epoch: 0
  description: "BlanketOps Environments Kubernetes Controller"
  target-architecture:
  - x86_64
  copyright:
  - license: Apache-2.0

environment:
  contents:
    packages:
    - busybox
    - ca-certificates-bundle

pipeline:
- uses: go/build
  with:
    packages: ./cmd/main.go
    output: manager

- uses: strip

- uses: go/install
  with:
    binaries: "manager"
