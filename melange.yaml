# =============================================================================
# melange.yaml — APK Package Build Spec
#
# Builds the BlanketOps Environments Controller binary as a Wolfi APK.
# Consumed by apko.yaml to assemble the final OCI image.
#
# Version:
#   Set to 0.0.0 as a placeholder. The apko.yml workflow patches this to the
#   actual release version before the build. Committed file is never modified.
#
# Private module access:
#   melange's go/build step runs inside a bubblewrap sandbox as uid=1000
#   (build user). git config --global writes to that user's home, which is
#   not /root — so the rewrite rule never applies to go mod download.
#
#   Fix: use .netrc at /root/.netrc with HOME=/root so go and git both find
#   the credentials regardless of which user runs the command. Also set
#   GIT_CONFIG_GLOBAL to an explicit path to avoid home dir ambiguity.
#
#   MELANGE_PAT is replaced with the actual PAT by apko.yml before the build.
#   All three occurrences (checkout URL, netrc, git config) are replaced by
#   the same sed pass.
#
# Tag format:
#   v${{package.version}} — matches actual git tags (v0.6.0).
#   After version patching: package.version = 0.6.0 → tag = v0.6.0.
# =============================================================================

package:
  name: blanketops-environments-controller
  version: 0.0.0
  epoch: 0
  description: "BlanketOps Environments Kubernetes Controller"
  target-architecture:
  - x86_64
  copyright:
  - license: Apache-2.0
  dependencies:
    runtime: []
  checks:
    disabled:
    - usrlocal
    - setuidgid
update:
  enabled: false

environment:
  contents:
    repositories:
    - https://packages.wolfi.dev/os
    keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
    - busybox
    - ca-certificates-bundle
    - go
    - git
    - openssh-client
  environment:
    GOPRIVATE: github.com/blanketops/*
    GONOSUMDB: github.com/blanketops/*
    GOPROXY: direct
    CGO_ENABLED: "0"
    # Pin HOME so .netrc is always found at /root/.netrc regardless of
    # which user melange's bwrap sandbox uses for the build steps.
    HOME: /root
    # Pin git config to an explicit path — avoids home dir ambiguity
    # when git config --global is called inside bwrap.
    GIT_CONFIG_GLOBAL: /etc/gitconfig-blanketops

pipeline:
- uses: git-checkout
  with:
    repository: https://github.com/blanketops/environments-controller
    tag: v${{package.version}}
    expected-commit: ""

# Configure credentials for private module downloads inside bwrap.
# git config --global is unreliable in bwrap (user home ambiguity).
# .netrc is universally picked up by git and go regardless of user.
# MELANGE_PAT is replaced by apko.yml sed pass 3 before the build.
- name: Configure authentication for private modules
  runs: |
    # .netrc — go mod download uses this for HTTPS credential resolution
    mkdir -p /root
    printf 'machine github.com\nlogin git\npassword MELANGE_PAT\n' > /root/.netrc
    chmod 600 /root/.netrc
    # git insteadOf rewrite — written to explicit path via GIT_CONFIG_GLOBAL
    git config --file /etc/gitconfig-blanketops \
      url."https://MELANGE_PAT@github.com/blanketops/".insteadOf \
      "https://github.com/blanketops/"

- uses: go/build
  with:
    packages: ./cmd
    output: manager
    ldflags: -s -w

- uses: strip
