contents:
  repositories:
  - https://packages.wolfi.dev/os
  - "@local /github/workspace/packages"
  keyring:
  - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  - "@local /github/workspace/melange-keyring/melange.rsa.pub"
  packages:
  - wolfi-baselayout
  - ca-certificates-bundle
  - blanketops-environments-controller@local

entrypoint:
  command: /usr/bin/manager

accounts:
  users:
  - username: nonroot
    uid: 65532
  groups:
  - groupname: nonroot
    gid: 65532

archs:
- x86_64
