# =============================================================================
# apko.yaml — Wolfi Image Assembly Spec
#
# Assembles the BlanketOps Environments Controller OCI image from:
#   - Wolfi base packages (ca-certificates, wolfi-baselayout)
#   - The controller APK built by melange (blanketops-environments-controller)
#
# Local packages:
#   The melange build outputs APKs to ./packages/. The plain path (no @local
#   prefix) is the correct repository reference for apko — @local is a package
#   pinning tag, not a repository type. The melange.rsa.pub key (generated at
#   build time with sign-with-temporary-key: true) is referenced in the
#   keyring so apko can verify the locally built APK.
#
# Runtime:
#   Runs as nonroot (uid 65532) — matches distroless/static:nonroot convention.
#   No shell. Minimal attack surface.
#
# Binary path:
#   melange go/build with output: manager installs to /usr/bin/manager
# =============================================================================

contents:
  repositories:
    - https://packages.wolfi.dev/os
    - ./packages
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./melange.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - blanketops-environments-controller

entrypoint:
  command: /usr/bin/manager

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - x86_64
