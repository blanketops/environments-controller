---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: events-manager-role
rules:
- apiGroups:
  - argoproj.io
  resources:
  - eventbus
  - eventsources
  - sensors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - eventsources/finalizers
  - sensors/finalizers
  verbs:
  - update
- apiGroups:
  - argoproj.io
  resources:
  - eventsources/status
  - sensors/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.blanketops.dev
  resources:
  - githubevents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.blanketops.dev
  resources:
  - githubevents/finalizers
  verbs:
  - update
- apiGroups:
  - events.blanketops.dev
  resources:
  - githubevents/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
