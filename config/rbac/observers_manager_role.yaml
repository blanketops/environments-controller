---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observers-manager-role
rules:
- apiGroups:
  - environments.blanketops.dev
  resources:
  - packages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - environments.blanketops.dev
  resources:
  - packages/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kappctrl.k14s.io
  resources:
  - apps
  verbs:
  - get
  - list
  - watch
