---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: networks-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  - issuers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.internal.knative.dev
  resources:
  - clusterdomainclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networks.blanketops.dev
  resources:
  - domains
  - routes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networks.blanketops.dev
  resources:
  - domains/finalizers
  - routes/finalizers
  verbs:
  - update
- apiGroups:
  - networks.blanketops.dev
  resources:
  - domains/status
  - routes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - serving.knative.dev
  resources:
  - domainmappings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
