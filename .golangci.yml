version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
  - copyloopvar
  - dupl
  - errcheck
  - ginkgolinter
  - goconst
  - gocyclo
  - govet
  - ineffassign
  - lll
  - modernize
  - misspell
  - nakedret
  - prealloc
  - revive
  - staticcheck
  - unconvert
  - unparam
  - unused
  settings:
    gocyclo:
      min-complexity: 40
    revive:
      rules:
      - name: comment-spacings
      - name: import-shadowing
    modernize:
      disable:
      - omitzero
      # Go 1.27 lets a struct literal set an embedded struct's fields
      # directly (Secret{Name: n} for Secret{ObjectMeta: ObjectMeta{Name: n}}).
      # Kept in the explicit form while the rest of the family is on Go 1.26.
      - embedlit
  exclusions:
    generated: lax
    rules:
    - linters:
      - lll
      path: api/*
    - linters:
      - dupl
      - lll
      path: internal/*
    paths:
    - third_party$
    - builtin$
    - examples$
formatters:
  enable:
  - gofmt
  - goimports
  exclusions:
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples$
