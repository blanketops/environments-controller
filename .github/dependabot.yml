# Automated dependency updates. Two ecosystems: Go modules (the actual
# runtime dependency graph) and GitHub Actions (the workflow files under
# .github/workflows/). PRs target main, so dependency updates land on main
# directly; develop takes them in the next sync from main.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
