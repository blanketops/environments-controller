# =============================================================================
# security.yml — Security & Vulnerability Scanning
#
# Three jobs (gosec, govulncheck, trivy-image), each keeping its original
# trigger scope via a job-level `if:` gate against the combined top-level trigger.
# =============================================================================

name: Security

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * 1" # govulncheck + trivy-image (:latest) — Monday 06:00 UTC

permissions:
  contents: read
  packages: read

env:
  GO_VERSION_FILE: go.mod
  IMAGE_REPO: ghcr.io/blanketops/environments-controller

jobs:
  gosec:
    name: Gosec
    runs-on: self-hosted
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-controller
          
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        id: gosec
        continue-on-error: true
        run: gosec -fmt=json -out=gosec-report.json ./... || true

      - name: Gosec Summary
        if: always()
        run: |
          {
            echo "> ### 🔒 **Gosec Static Analysis**"
            echo "> "
            echo "> * **Branch:** \`${{ github.ref_name }}\`"
            echo "> * **Trigger:** \`${{ github.event_name }}\`"
            echo "> * **Status:** Report-only (non-blocking)"
            echo
            if jq -e '.Issues and (.Issues | length > 0)' gosec-report.json >/dev/null 2>&1; then
              echo "| Severity | Confidence | Rule | Location | Details |"
              echo "|---|---|---|---|---|"
              jq -r '.Issues[] | "| \(.severity) | \(.confidence) | \(.rule_id) | \(.file):\(.line) | \(.details | gsub("\\|"; "\\\\|")) |"' gosec-report.json
            else
              echo "No findings."
            fi
            echo
            echo "<details><summary>Raw report (JSON)</summary>"
            echo
            echo '```json'
            head -c 60000 gosec-report.json 2>/dev/null
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  govulncheck:
    name: govulncheck
    runs-on: self-hosted
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false

      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -json ./... > govulncheck-report.json 2>govulncheck-stderr.txt || true

      - name: Govulncheck Summary
        if: always()
        run: |
          {
            echo "> ### 🛡️ **govulncheck Scan**"
            echo "> "
            echo "> * **Branch:** \`${{ github.ref_name }}\`"
            echo "> * **Trigger:** \`${{ github.event_name }}\`"
            echo "> * **Status:** Report-only (non-blocking)"
            echo
            COUNT=$(jq -s '[.[] | select(.finding != null)] | length' govulncheck-report.json 2>/dev/null || echo 0)
            if [[ "$COUNT" -gt 0 ]]; then
              echo "| OSV ID | Module | Version | Fixed | Function |"
              echo "|---|---|---|---|---|"
              jq -s -r '.[] | select(.finding != null) | .finding |
                {
                  osv: .osv,
                  module: ([.trace[]? | select(.module) | .module] | first // "-"),
                  version: ([.trace[]? | select(.version) | .version] | first // "-"),
                  fixed: (.fixed_version // "-"),
                  function: ([.trace[]? | select(.function) | .function] | first // "-")
                } | "| \(.osv) | \(.module) | \(.version) | \(.fixed) | \(.function) |"' \
                govulncheck-report.json | sort -u
            else
              echo "No known vulnerabilities found."
            fi
            echo
            echo "<details><summary>Raw report (JSON)</summary>"
            echo
            echo '```json'
            head -c 60000 govulncheck-report.json 2>/dev/null
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  trivy-image:
    name: Trivy Image Scan
    runs-on: self-hosted
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-controller
          
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image ref
        id: image
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ref=${{ env.IMAGE_REPO }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ env.IMAGE_REPO }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: template
          template: "@/contrib/markdown.tpl"
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          output: trivy-report.md
          cache: "false"
          cache-dir: /var/cache/zenith/trivy
          skip-setup-trivy: "true"

      - name: Trivy Summary
        if: always()
        run: |
          {
            echo "> ### 🐳 **Trivy Image Scan**"
            echo "> "
            echo "> * **Image:** \`${{ steps.image.outputs.ref }}\`"
            echo "> * **Trigger:** \`${{ github.event_name }}\`"
            echo "> * **Status:** Report-only (non-blocking)"
            echo
            if [[ -s trivy-report.md ]]; then
              head -c 100000 trivy-report.md
            else
              echo "No findings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
