name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"
                  cache: true

            - name: Tidy
              run: go mod tidy && git diff --exit-code

            - name: Build
              run: go build ./...

            - name: Lint (optional)
              run: |
                  go install honnef.co/go/tools/cmd/staticcheck@latest
                  staticcheck ./...
