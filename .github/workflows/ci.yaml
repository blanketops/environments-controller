# =============================================================================
# ci.yaml — CI Build, Lint, Test, and Coverage
#
# Runs on every push to main and every pull request. Builds the controller
# binary, checks formatting, lints, runs the test suite, and publishes a
# coverage report (step summary table + gocov-html artifact) — mirroring the
# environments library's own CI coverage job, minus the vendor-snapshot
# machinery this repo doesn't need (no vendor/ directory here).
#
# Changes from previous:
#   - go-version-file: go.mod instead of hardcoded version
#   - Removed Force Remote Dependency step — replace directives must not be
#     committed to go.mod; local replace is development-only
#   - Removed -mod=vendor — controller fetches deps from the public module
#     proxy at build time; vendor directory is not committed in this repo
#   - golangci-lint replaces staticcheck — consistent with library CI
#   - go vet added before lint
#   - Added gofmt check, go test + coverage, and a gocov-html report
#
# No secrets required — environments, environments-api, and
# environments-contract are public modules, so plain `go build` resolves
# them via the public module proxy with no git auth needed. This also
# means the job runs on Dependabot PRs, which don't get repo secrets.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write   # test-helper opens one tracking issue per test file

env:
  GO_VERSION_FILE: go.mod
  # test-helper (environments-bots) opens one tracking issue per test file and
  # posts each run's results. Pinned to the commit that added -tests-dir/-exclude.
  TEST_HELPER_REF: 0a0a2216c78ac8d6458aa5d76d6c7570fc1c2a10

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name "*.go" -not -path "./vendor/*"))
          if [ -n "${UNFORMATTED}" ]; then
            echo "The following files are not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi
          echo "All files formatted correctly"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          skip-cache: true
          args: --timeout=5m

      - name: Test
        id: test
        run: |
          set +e
          go test ./... -json -coverprofile=coverage.out -covermode=atomic > "${RUNNER_TEMP}/go-test.json"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          echo "failed test events: $(grep -c '\"Action\":\"fail\"' "${RUNNER_TEMP}/go-test.json" 2>/dev/null || echo 0)"
          exit 0

      - name: Ensure coverage file exists
        run: test -f coverage.out

      - name: Generate coverage HTML
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Build gocov (patched for this Go toolchain)
        run: |
          git clone --depth 1 --branch v1.2.1 https://github.com/axw/gocov.git /tmp/gocov-src
          cd /tmp/gocov-src
          go mod edit -replace golang.org/x/tools=golang.org/x/tools@v0.48.0
          go mod tidy
          go build -o "$(go env GOPATH)/bin/gocov" ./gocov

      - name: Install gocov-html
        run: go install github.com/matm/gocov-html/cmd/gocov-html@latest

      - name: Generate beauty coverage report
        run: gocov convert coverage.out | gocov-html > beauty-report.html

      # - name: Upload coverage artifacts
      #   uses: actions/upload-artifact@v7
      #   continue-on-error: true
      #   with:
      #     name: coverage-report-${{ github.sha }}
      #     path: |
      #       coverage.out
      #       coverage.html
      #       beauty-report.html
      #     retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          TOTAL=$(go tool cover -func=coverage.out 2>/dev/null | grep "^total" | awk '{print $3}' || echo "N/A")

          # coverage.out is a per-statement profile (mode: atomic\nfile:line.col,line.col numStmt count),
          # not per-package — aggregate statement counts by package directory
          # instead of dumping go tool cover -func's one-row-per-function
          # output, which runs to hundreds of rows in a repo this size.
          PKG_ROWS=$(awk '
            NR==1 { next }
            {
              split($1, fp, ":")
              n = split(fp[1], dirs, "/")
              pkg = ""
              for (i = 1; i < n; i++) pkg = pkg (i > 1 ? "/" : "") dirs[i]
              total[pkg] += $2
              if ($3 > 0) covered[pkg] += $2
            }
            END {
              for (p in total) {
                pct = (total[p] > 0) ? (covered[p] / total[p] * 100) : 0
                printf "%.1f\t%s\n", pct, p
              }
            }
          ' coverage.out 2>/dev/null | sort -n)

          PKG_COUNT=$(echo "${PKG_ROWS}" | grep -c . || echo 0)

          TABLE=$(echo "${PKG_ROWS}" | awk -F'\t' '{
            pkg=$2; gsub(/github.com\/blanketops\/environments-controller\//, "", pkg);
            printf "| %s | %.1f%% |\n", pkg, $1
          }')

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📊 Coverage Report

          **Total Coverage:** \`${TOTAL}\`

          <details>
          <summary>Package coverage (${PKG_COUNT} packages, weakest first)</summary>

          | Package | Coverage |
          | ------- | -------- |
          ${TABLE}

          </details>

          > 📦 Download artifact \`coverage-report-${{ github.sha }}\` from this run for the full \`gocov-html\` report (\`beauty-report.html\`) with per-function detail, plus the raw \`coverage.out\`/\`coverage.html\`.
          EOF

      # One tracking issue per test file + this run's per-file results, as in
      # environments. Best-effort (fork PRs have no bot token); never fails CI.
      - name: Install test-helper
        id: test-helper
        if: always()
        continue-on-error: true
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/blanketops/environments-bots/cmd/test-helper@${TEST_HELPER_REF}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Mint the developer bot's token
        id: bot-token
        if: always() && steps.test-helper.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-controller

      - name: Open an issue per test file
        if: always() && steps.test-helper.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          PROJECT: ${{ steps.bot-token.outputs.token && 'blanketops/1' || '' }}
          SOURCE: ${{ github.event.pull_request.html_url || github.event.head_commit.url }}
        run: test-helper sync -tests-dir . -exclude vendor -source "$SOURCE" ${PROJECT:+-project "$PROJECT"}

      - name: Post test results to the issues
        if: always() && steps.test-helper.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          REF: "${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        run: test-helper report -tests-dir . -exclude vendor -go-json "${RUNNER_TEMP}/go-test.json" -ref "$REF"

      - name: Fail the job if tests failed
        if: always()
        run: |
          code='${{ steps.test.outputs.exit }}'
          if [ "$code" != "0" ]; then
            echo "::error::go test failed (exit ${code})"
            exit 1
          fi

      - name: CI Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🔧 CI Build

          **Branch:** \`${{ github.ref_name }}\`
          **Trigger:** \`${{ github.event_name }}\`
          **Commit:** \`${{ github.sha }}\`

          ## Steps
          - Checkout
          - Setup Go (from \`go.mod\`)
          - \`go build ./...\`
          - \`go vet ./...\`
          - \`gofmt -l\`
          - \`golangci-lint run\`
          - \`go test ./... -coverprofile\`
          - Coverage report (see above)
          EOF
