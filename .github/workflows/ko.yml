# =============================================================================
# apko.yml — Wolfi Image Build
#
# Builds a Wolfi-based OCI image using melange + apko, then signs and attests
# it via Cosign + Sigstore.
#
# When to use vs ko.yml:
#   ko.yml  — standard controller builds; fast, Go-native, no Containerfile
#   apko.yml — when a hardened Wolfi base is required (compliance, CVE posture)
#
# Prerequisites:
#   melange.yaml — package build spec (APK)
#   apko.yaml    — image assembly spec (OCI layers from APK)
#
# Changes from previous:
#   - Pinned chainguard-dev/actions@v1.6.21 (already done)
#   - GHCR login uses GH_PAT for consistency with other workflows
#   - go-version-file guard removed — apko does not use Go directly
#   - Heredoc quoted (<<'EOF') for static content blocks
#   - Tag strategy: version + latest on tag push, branch name only otherwise
#
# Secrets required:
#   GH_PAT         — GHCR push access
#   SSH_PRIVATE_KEY — private module git access during melange build
# =============================================================================

name: Wolfi Image

on:
  workflow_dispatch:
    inputs:
      sign_and_attest:
        description: "Sign and attest the image after build"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPO: ghcr.io/ntlaletsi70/blanketops-environments-controller

jobs:
  wolfi:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@v1.6.21

      - name: Build package
        uses: chainguard-dev/actions/melange-build@v1.6.21
        with:
          config: melange.yaml
          archs: x86_64
          sign-with-temporary-key: true
          workdir: .

      # Tag strategy: version + latest on tag push; branch name only otherwise.
      - name: Compute image tags
        id: tags
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        id: build
        uses: chainguard-dev/actions/apko-build@v1.6.21
        with:
          config: apko.yaml
          tag: ${{ env.IMAGE_REPO }}:${{ steps.tags.outputs.tag }}

      - name: Install cosign
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        uses: sigstore/cosign-installer@v3

      - name: Sign image
          cosign-release: 'v2.4.1'

      - name: Install ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      # Both ko and oras have separate credential stores — login both here.
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GH_PAT }}" | ko login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          echo "${{ secrets.GH_PAT }}" | oras login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and Push Controller
        id: ko-build
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}/controller
        run: |
          ko build ./cmd --bare \
            --platform linux/amd64,linux/arm64 \
            --tags "${{ github.ref_name }},latest" \
            --image-refs /tmp/ko-image-refs
          echo "digest=$(tail -1 /tmp/ko-image-refs | cut -d@ -f2)" >> $GITHUB_OUTPUT

      - name: Sign and Attest
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}

      - name: Attest image provenance
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Wolfi Image Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # 🐺 Wolfi Image Build
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          **Image:** \`${{ env.IMAGE_REPO }}:${{ steps.tags.outputs.tag }}\`
          **Digest:** \`${{ steps.build.outputs.digest }}\`
          **Trigger:** \`${{ github.event_name }}\`

          ## Completed
          - Built APK package with melange
          - Built OCI image with apko
          - Pushed to GHCR

          ## Signing and Attestation
          - Sign and attest: \`${{ github.event_name != 'workflow_dispatch' || inputs.sign_and_attest }}\`
          - Signed with Cosign (keyless via Sigstore)
          - Provenance attested via actions/attest-build-provenance
          EOF
