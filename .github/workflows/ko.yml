name: CI Controller Pipeline

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      sign_and_attest:
        description: "Sign and attest the image"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure git for private modules
        run: |
          git config --global url."git@github.com:ntlaletsi70/".insteadOf "https://github.com/ntlaletsi70/"

      - name: Install Tools
        run: |
          go install github.com/magefile/mage@latest
          go install github.com/sigstore/cosign/v2/cmd/cosign@latest

      - name: Setup ko
        uses: ko-build/setup-ko@v0.7

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GH_PAT }}" | ko login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Build and Push Controller
        id: ko-build
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}/controller
        run: |
          ko build ./cmd --bare --platform linux/amd64,linux/arm64 --tags ${{ github.ref_name }},latest --image-refs /tmp/ko-image-refs
          echo "digest=$(tail -1 /tmp/ko-image-refs | cut -d@ -f2)" >> $GITHUB_OUTPUT

      - name: Sign and Attest
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/controller@${{ steps.ko-build.outputs.digest }}
          
      - name: Publish Artifacts (Mage + ORAS)
        id: publish
        run: |
          # Ensure ORAS is available for your mage tasks
          go install oras.land/oras/cmd/oras@latest
          mage -v publish

      - name: CI Summary
        if: always()
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository }}/controller"
          ARTIFACT_REF="ghcr.io/${{ github.repository_owner }}/environments-controller:${{ github.ref_name }}"
          
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🚀 BlanketOps v1.0.0 Pipeline
          
          ## 🐳 Controller Image
          - **Registry:** \`$IMAGE_REF\`
          - **Digest:** \`${{ steps.ko-build.outputs.digest }}\`
          
          ## 📦 Artifact Package
          - **Status:** ${{ steps.publish.outcome == 'success' && '✅ Published' || '❌ Failed' }}
          - **Ref:** \`$ARTIFACT_REF\`
          
          ## How to Consume
          \`\`\`bash
          # Pull the artifact package
          oras pull $ARTIFACT_REF
          
          # Apply manifest
          kubectl apply -f crds.yaml
          \`\`\`
          EOF