# =============================================================================
# release.yml — Publish GitHub Release
#
# Fires on push of a v* tag (finalize-release.yml creates it). Reads the
# already-current CHANGELOG.md for release notes and publishes a GitHub
# Release. CHANGELOG.md itself is generated and committed by
# finalize-release.yml before it tags; this workflow only reads it.
#
# Trigger scope:
#   push tags matching v*
#
# Secrets required:
#   GITHUB_TOKEN — via actions/create-github-app-token for checkout/release
# =============================================================================
name: Release
on:
    push:
        tags:
            - "v*"
permissions:
    contents: write
    packages: read
env:
    IMAGE_REPO: ghcr.io/blanketops/environments-controller
jobs:
    release:
      runs-on: self-hosted
      steps:
        - name: Generate GitHub App token
          id: app-token
          uses: actions/create-github-app-token@v3
          with:
            app-id: ${{ vars.APP_CLIENT_ID }}
            private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
            owner: blanketops
            repositories: environments-controller

        - name: Checkout tag
          uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Install git-cliff
          run: |
              GITCLIFF_VERSION="2.13.0"
              curl -L "https://github.com/orhun/git-cliff/releases/download/v${GITCLIFF_VERSION}/git-cliff-${GITCLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
              tar xzf git-cliff.tar.gz
              sudo mv "git-cliff-${GITCLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
              rm -rf git-cliff.tar.gz "git-cliff-${GITCLIFF_VERSION}"
              git-cliff --version

        - name: Checkout main
          run: |
              git checkout main
              git pull origin main

        - name: Generate release notes
          run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

        - name: Check crane
          run: crane version

        - name: Login to GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Resolve container image digest
          id: image
          run: |
              IMAGE_TAG="${{ env.IMAGE_REPO }}:${{ github.ref_name }}"
              DIGEST=""
              for i in $(seq 1 30); do
                DIGEST=$(crane digest "$IMAGE_TAG" 2>/dev/null) && break
                echo "Waiting for $IMAGE_TAG to be published ($i/30)..."
                sleep 10
              done
              if [[ -z "$DIGEST" ]]; then
                echo "::warning::Could not resolve digest for $IMAGE_TAG within timeout — image link will be omitted from release notes"
              fi
              echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
              echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

        - name: Append container image section to release notes
          if: steps.image.outputs.digest != ''
          run: |
              cat >> RELEASE_NOTES.md <<EOF

              ## Container Image

              \`\`\`
              docker pull ${{ steps.image.outputs.tag }}
              \`\`\`

              - Digest: \`${{ env.IMAGE_REPO }}@${{ steps.image.outputs.digest }}\`
              - Package: https://github.com/blanketops/environments-controller/pkgs/container/environments-controller
              EOF

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v3
          with:
            body_path: RELEASE_NOTES.md
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Release Summary
          run: |
              cat >> $GITHUB_STEP_SUMMARY <<EOF
              # 📦 GitHub Release Published

              **Version:** \`${{ github.ref_name }}\`

              ## Completed

              - Generated CHANGELOG.md using git-cliff
              - Committed changelog updates to main
              - Generated release notes
              - Published GitHub Release

              ## Artifacts

              - CHANGELOG.md
              - RELEASE_NOTES.md
              - GitHub Release

               ## Source Tag

               \`${{ github.ref_name }}\`

              ## Container Image

              **Image:** \`${{ steps.image.outputs.tag }}\`
              **Digest:** \`${{ steps.image.outputs.digest }}\`

              EOF

        - name: Releaser complete
          if: always()
          uses: blanketops/environments-bots/.github/actions/releaser@v0.0.3
          with:
            command: complete
            release: ${{ github.ref_name }}
            app-id: ${{ secrets.RELEASER_APP_ID }}
            private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
