# =============================================================================
# release.yml — Publish GitHub Release & Container Image Attestations
#
# Fires on push of a v* tag (finalize-release.yml creates it). Reads the
# already-current CHANGELOG.md for release notes, resolves the container image
# digest from GHCR, generates native build attestations, and publishes a release.
# =============================================================================
name: Release
on:
    push:
        tags:
            - "v*"
permissions:
    contents: write
    packages: write     # <--- Change from 'read' to 'write'
    id-token: write     # Required for OIDC signing / identity tokens
    attestations: write # Required for GitHub native build provenance attestations
env:
    IMAGE_REPO: ghcr.io/blanketops/environments-controller
jobs:
    release:
      runs-on: self-hosted
      steps:
        - name: Generate GitHub App token
          id: app-token
          uses: actions/create-github-app-token@v3
          with:
            client-id: ${{ vars.APP_CLIENT_ID }}
            private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
            owner: blanketops
            repositories: environments-controller

        - name: Checkout tag
          uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Checkout main
          run: |
              git checkout main
              git pull origin main

        - name: Generate release notes
          run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

        - name: Check crane
          run: crane version

        - name: Login to GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Resolve container image digest
          id: image
          run: |
              IMAGE_TAG="${{ env.IMAGE_REPO }}:${{ github.ref_name }}"
              DIGEST=""
              for i in $(seq 1 30); do
                DIGEST=$(crane digest "$IMAGE_TAG" 2>/dev/null) && break
                echo "Waiting for $IMAGE_TAG to be published ($i/30)..."
                sleep 10
              done
              if [[ -z "$DIGEST" ]]; then
                echo "::error::Could not resolve digest for $IMAGE_TAG within timeout."
                exit 1
              fi
              echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
              echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

        - name: Generate GitHub Native Container Attestation
          if: steps.image.outputs.digest != ''
          uses: actions/attest-build-provenance@v2
          with:
            subject-name: ${{ env.IMAGE_REPO }}
            subject-digest: ${{ steps.image.outputs.digest }}
            push-to-registry: true

        - name: Append container image section to release notes
          if: steps.image.outputs.digest != ''
          run: |
              cat >> RELEASE_NOTES.md <<EOF

              ## Container Image & Supply Chain

              \`\`\`
              docker pull ${{ steps.image.outputs.tag }}
              \`\`\`

              - **Digest:** \`${{ env.IMAGE_REPO }}@${{ steps.image.outputs.digest }}\`
              - **Package:** https://github.com/blanketops/environments-controller/pkgs/container/environments-controller
              - **Attestation:** Verified via GitHub Native Build Provenance
              EOF

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v3
          with:
            body_path: RELEASE_NOTES.md
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Release Summary
          run: |
              cat >> $GITHUB_STEP_SUMMARY <<EOF
              # 📦 GitHub Release Published

              **Version:** \`${{ github.ref_name }}\`

              ## Completed

              - Generated CHANGELOG.md using git-cliff
              - Committed changelog updates to main
              - Generated release notes
              - Generated GitHub build provenance attestation for container image
              - Published GitHub Release

               ## Artifacts

              - CHANGELOG.md
              - RELEASE_NOTES.md
              - GitHub Release

               ## Source Tag

               \`${{ github.ref_name }}\`

              ## Container Image & Attestation

              **Image:** \`${{ steps.image.outputs.tag }}\`
              **Digest:** \`${{ steps.image.outputs.digest }}\`
              **Attestation:** Attached to OCI Registry

              EOF

        - name: Generate Releaser App token
          id: releaser-token
          uses: actions/create-github-app-token@v3
          with:
            client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
            private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
            owner: blanketops
            repositories: environments-controller

        - name: Releaser complete
          env:
            GH_TOKEN: ${{ steps.releaser-token.outputs.token }}
          run: releaser complete -release "${{ github.ref_name }}" -project blanketops/1
