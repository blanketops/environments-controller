name: Release
on:
    push:
        tags:
            - "v*"
permissions:
    contents: write
    packages: read
env:
    IMAGE_REPO: ghcr.io/blanketops/environments-controller
jobs:
    release:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout tag
          uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Install git-cliff
          run: |
              GITCLIFF_VERSION="2.13.0"
              curl -L "https://github.com/orhun/git-cliff/releases/download/v${GITCLIFF_VERSION}/git-cliff-${GITCLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
              tar xzf git-cliff.tar.gz
              sudo mv "git-cliff-${GITCLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
              rm -rf git-cliff.tar.gz "git-cliff-${GITCLIFF_VERSION}"
              git-cliff --version

        - name: Checkout main
          run: |
              git checkout main
              git pull origin main

        - name: Generate CHANGELOG.md
          run: git-cliff --config .cliff.toml --output CHANGELOG.md

        - name: Commit changelog
          run: |
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git add CHANGELOG.md
              git commit -m "chore(release): update changelog for ${{ github.ref_name }}" || echo "No changes"
              git push origin main

        - name: Generate release notes
          run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

        - name: Setup crane
          uses: imjasonh/setup-crane@v0.4

        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # ko.yml builds and pushes this same tag concurrently (both fire on
        # the same tag push) — poll rather than assume it's already there.
        - name: Resolve container image digest
          id: image
          run: |
              IMAGE_TAG="${{ env.IMAGE_REPO }}:${{ github.ref_name }}"
              DIGEST=""
              for i in $(seq 1 30); do
                DIGEST=$(crane digest "$IMAGE_TAG" 2>/dev/null) && break
                echo "Waiting for $IMAGE_TAG to be published ($i/30)..."
                sleep 10
              done
              if [[ -z "$DIGEST" ]]; then
                echo "::warning::Could not resolve digest for $IMAGE_TAG within timeout — image link will be omitted from release notes"
              fi
              echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
              echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

        - name: Append container image section to release notes
          if: steps.image.outputs.digest != ''
          run: |
              cat >> RELEASE_NOTES.md <<EOF

              ## Container Image

              \`\`\`
              docker pull ${{ steps.image.outputs.tag }}
              \`\`\`

              - Digest: \`${{ env.IMAGE_REPO }}@${{ steps.image.outputs.digest }}\`
              - Package: https://github.com/blanketops/environments-controller/pkgs/container/environments-controller
              EOF

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            body_path: RELEASE_NOTES.md
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Release Summary
          run: |
              cat >> $GITHUB_STEP_SUMMARY <<EOF
              # 📦 GitHub Release Published

              **Version:** \`${{ github.ref_name }}\`

              ## Completed

              - Generated CHANGELOG.md using git-cliff
              - Committed changelog updates to main
              - Generated release notes
              - Published GitHub Release

              ## Artifacts

              - CHANGELOG.md
              - RELEASE_NOTES.md
              - GitHub Release

               ## Source Tag

               \`${{ github.ref_name }}\`

              ## Container Image

              **Image:** \`${{ steps.image.outputs.tag }}\`
              **Digest:** \`${{ steps.image.outputs.digest }}\`

              EOF