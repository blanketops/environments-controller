# =============================================================================
# plan-release.yml — Plan the Next Release
#
# Runs on every push to develop. The releaser (cmd/releaser plan), as the
# BlanketOps Environments Releaser App, notices when develop has commits
# that no release carries yet and keeps one Release issue planned for them
# ("Release: {version}", on project 1 as Release), with the version their
# Conventional Commits need. It renames the planned issue when a later
# commit needs a larger bump (a breaking change) before the branch is cut.
# It does nothing when there is nothing to release or when the planned
# release's branch is already cut.
#
# Cutting stays a decision: run Create Release when develop is ready.
#
# Secrets required:
#   DEVELOPER_APP_ID, DEVELOPER_APP_PRIVATE_KEY — the BlanketOps Environments
#   Developer App
# =============================================================================

name: Plan Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plan-and-cut
  cancel-in-progress: false

jobs:
  plan:
    name: releaser plan
    runs-on: self-hosted

    steps:
      - name: Generate Releaser App token
        id: releaser-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: ${{ github.event.repository.name }}

      - name: Download and verify the releaser binary
        env:
          GH_TOKEN: ${{ steps.releaser-token.outputs.token }}
          RELEASER_VERSION: v0.1.0
        run: |
          set -euo pipefail
          gh release download "${RELEASER_VERSION}" -R blanketops/environments-bots \
            -p releaser-linux-amd64 -p releaser-linux-amd64.sigstore.json \
            -D "${RUNNER_TEMP}"
          cosign verify-blob \
            --bundle "${RUNNER_TEMP}/releaser-linux-amd64.sigstore.json" \
            --certificate-identity "https://github.com/blanketops/environments-bots/.github/workflows/release.yml@refs/tags/${RELEASER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RUNNER_TEMP}/releaser-linux-amd64"
          chmod +x "${RUNNER_TEMP}/releaser-linux-amd64"

      - name: Releaser plan
        env:
          GH_TOKEN: ${{ steps.releaser-token.outputs.token }}
        run: '"${RUNNER_TEMP}/releaser-linux-amd64" plan -ref develop -project blanketops/1'
