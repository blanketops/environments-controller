# =============================================================================
# apko.yml — Wolfi Image Build
#
# Builds a Wolfi-based OCI image using melange + apko, then signs and attests
# it via Cosign + Sigstore.
#
# When to use vs ko.yml:
#   ko.yml   — standard controller builds; fast, Go-native, no Containerfile
#   apko.yml — when a hardened Wolfi base is required (compliance, CVE posture)
#
# Prerequisites:
#   melange.yaml — package build spec (APK)
#   apko.yaml    — image assembly spec (OCI layers from APK)
#
# Tag strategy:
#   tag push  → versioned tag + latest (crane tag adds latest after build)
#   manual    → ref_name only
#
# Secrets required:
#   GH_PAT         — GHCR push access
#   SSH_PRIVATE_KEY — private module git access during melange build
# =============================================================================

name: Wolfi Image

on:
  workflow_dispatch:
    inputs:
      sign_and_attest:
        description: "Sign and attest the image after build"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPO: ghcr.io/ntlaletsi70/blanketops-environments-controller

jobs:
  wolfi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@v1.6.21

      - name: Build package
        uses: chainguard-dev/actions/melange-build@v1.6.21
        with:
          config: melange.yaml
          archs: x86_64
          sign-with-temporary-key: true
          workdir: .

      - name: Compute image tag
        id: tags
        run: |
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        id: build
        uses: chainguard-dev/actions/apko-build@v1.6.2
