# =============================================================================
# apko.yml — Wolfi Image Build
#
# Builds a Wolfi-based OCI image using melange + apko, then signs and attests
# it via Cosign + Sigstore.
#
# When to use vs ko.yml:
#   ko.yml   — standard controller builds; fast, Go-native, no Containerfile
#   apko.yml — when a hardened Wolfi base is required (compliance, CVE posture)
#
# Prerequisites:
#   melange.yaml — package build spec (APK)
#   apko.yaml    — image assembly spec (OCI layers from APK)
#
# apko build strategy:
#   Installs apko binary directly from GitHub releases — avoids the apko-build
#   action which runs apko inside a distroless Docker container with no /bin/sh.
#   Version tag (v0.x.y) and tarball filename (0.x.y) differ — both handled.
#
# melange.yaml patching (three sed passes, runner copy only):
#   1. version:     0.0.0 → release version (v stripped, e.g. 0.6.0)
#   2. checkout URL: HTTPS → HTTPS+PAT (controller repo clone inside bwrap)
#   3. MELANGE_PAT: placeholder → actual PAT — covers both:
#        a) .netrc entry (go mod download credential resolution)
#        b) git insteadOf rewrite (fallback git credential)
#
# Private module auth strategy:
#   melange builds run inside a bubblewrap sandbox as uid=1000 (build user).
#   git config --global is unreliable (home dir ambiguity). Instead:
#     - .netrc at /root/.netrc with HOME=/root set in melange environment
#     - git config written to explicit path via GIT_CONFIG_GLOBAL
#   Both are populated by the MELANGE_PAT sed replacement.
#
# Version sources:
#   tag push         → stripped from git tag (v0.6.0 → 0.6.0)
#   workflow_dispatch → explicit version input (v prefix stripped if present)
#
# Tag strategy:
#   tag push  → versioned tag + latest (crane tag adds latest after build)
#   manual    → v{version} only — latest never tagged on manual dispatch
#
# Secrets required:
#   GH_PAT — GHCR push + melange repo clone + private go module access
# =============================================================================

name: Wolfi Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.6.0 or v0.6.0)"
        required: true
      sign_and_attest:
        description: "Sign and attest the image after build"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPO: ghcr.io/BlanketOps/blanketops-environments-controller

jobs:
  wolfi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@v1.6.21

      # Three sed passes on the runner copy of melange.yaml.
      # The committed file is never modified.
      #
      # Pass 1 — version: strip v prefix always (safe for v0.6.0 and 0.6.0)
      # Pass 2 — checkout URL: inject PAT for controller repo clone in bwrap
      # Pass 3 — MELANGE_PAT: inject PAT into .netrc entry + git insteadOf rule
      #           inside bwrap (covers go mod download of all private deps)
      - name: Patch melange config
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # Always strip v prefix — melange requires bare semver (0.6.0 not v0.6.0)
          VERSION="${VERSION#v}"

          # Pass 1: version
          sed -i "s/^  version: .*/  version: ${VERSION}/" melange.yaml

          # Pass 2: checkout URL → HTTPS+PAT
          sed -i \
            "s|https://github.com/blanketops/|https://${{ secrets.GH_PAT }}@github.com/blanketops/|g" \
            melange.yaml

          # Pass 3: MELANGE_PAT placeholder → actual PAT
          # Covers both .netrc and git insteadOf entries in the pipeline step
          sed -i "s|MELANGE_PAT|${{ secrets.GH_PAT }}|g" melange.yaml

          echo "Patched version: ${VERSION}"

      - name: Build package
        uses: chainguard-dev/actions/melange-build@v1.6.21
        with:
          config: melange.yaml
          archs: x86_64
          sign-with-temporary-key: true
          workdir: .

      # Verify melange output before apko — surfaces missing APK or APKINDEX
      # early so failures are obvious rather than buried in apko error messages.
      - name: Verify melange output
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" 2>/dev/null || echo "No .apk files found"
          echo "=== APKINDEX files ==="
          find . -name "APKINDEX*" 2>/dev/null || echo "No APKINDEX files found"
          echo "=== packages dir ==="
          ls -la packages/ 2>/dev/null || echo "packages/ not found"
          ls -la packages/x86_64/ 2>/dev/null || echo "packages/x86_64/ not found"

      # tag push  → versioned tag + latest
      # manual    → v{version} only; latest never tagged on manual dispatch
      - name: Compute image tag
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          fi

      # Install apko binary directly from GitHub releases.
      # The version tag uses v prefix (v0.x.y) but the tarball filename
      # uses the bare version (0.x.y) — both are handled below.
      - name: Install apko
        run: |
          APKO_VERSION=$(curl -sf https://api.github.com/repos/chainguard-dev/apko/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          APKO_VERSION_CLEAN="${APKO_VERSION#v}"
          curl -sL "https://github.com/chainguard-dev/apko/releases/download/${APKO_VERSION}/apko_${APKO_VERSION_CLEAN}_linux_amd64.tar.gz" \
            | tar xz
          sudo mv apko_${APKO_VERSION_CLEAN}_linux_amd64/apko /usr/local/bin/apko
          apko version

      - name: Build and push image
        id: build
        run: |
          apko publish apko.yaml \
            ${{ env.IMAGE_REPO }}:${{ steps.tags.outputs.tag }} \
            --keyring-append melange.rsa.pub \
            --image-refs /tmp/apko-image-refs
          DIGEST=$(head -1 /tmp/apko-image-refs | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # apko publish only accepts a single tag — use crane to add latest
      # after the build without re-running the full image assembly.
      - name: Install crane
        if: steps.tags.outputs.push_latest == 'true'
        uses: imjasonh/setup-crane@v0.4

      # ko.yml builds and pushes the same tag concurrently (both fire on the
      # same tag push) — poll for the digest to resolve before tagging latest
      # rather than assuming GHCR has it immediately.
      - name: Tag latest
        if: steps.tags.outputs.push_latest == 'true'
        run: |
          IMAGE_REF="${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 18); do
            crane digest "$IMAGE_REF" >/dev/null 2>&1 && break
            echo "Waiting for $IMAGE_REF to resolve ($i/18)..."
            sleep 10
          done
          crane tag "$IMAGE_REF" latest

      - name: Install cosign
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}

      # - name: Attest image provenance
      #   if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
      #   uses: actions/attest-build-provenance@v2
      #   with:
      #     subject-name: ${{ env.IMAGE_REPO }}
      #     subject-digest: ${{ steps.build.outputs.digest }}
      #     push-to-registry: true

      - name: Wolfi Image Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # 🐺 Wolfi Image Build
          EOF
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          **Image:** \`${{ env.IMAGE_REPO }}:${{ steps.tags.outputs.tag }}\`
          **Digest:** \`${{ steps.build.outputs.digest }}\`
          **Latest tagged:** \`${{ steps.tags.outputs.push_latest }}\`
          **Trigger:** \`${{ github.event_name }}\`

          ## Completed
          - Patched melange.yaml (version + PAT injection x3)
          - Built APK package with melange
          - Built and pushed OCI image with apko publish
          - Pushed to GHCR
          ${{ steps.tags.outputs.push_latest == 'true' && '- Tagged latest via crane' || '' }}

          ## Signing and Attestation
          - Signed with Cosign (keyless via Sigstore)
          - Provenance attested via actions/attest-build-provenance
          EOF
