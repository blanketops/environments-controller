name: Image
on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            sign_and_attest:
                description: "Sign and attest the image after build"
                type: boolean
                default: true
permissions:
    contents: read
    packages: write
    id-token: write
    attestations: write
jobs:
    build:
        if: false
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup SSH
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Registry
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Containerfile
                  push: true
                  ssh: default=${{ env.SSH_AUTH_SOCK }}
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      docker.io/nkanyezisolutions/blanketops-environments-controller:latest
                      docker.io/nkanyezisolutions/blanketops-environments-controller:${{ github.ref_name }}

            - name: Install cosign
              if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
              uses: sigstore/cosign-installer@v3

            - name: Sign image
              if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
              run: |
                  cosign sign --yes \
                    docker.io/nkanyezisolutions/blanketops-environments-controller@${{ steps.build.outputs.digest }}

            - name: Attest image provenance
              if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
              uses: actions/attest-build-provenance@v2
              with:
                  subject-name: docker.io/nkanyezisolutions/blanketops-environments-controller
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true
                  
            - name: Image Summary
              run:       
