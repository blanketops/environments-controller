# =============================================================================
# image.yml — Containerfile-based Image Build → Docker Hub
#
# Builds a multi-arch controller image from Containerfile and pushes to
# Docker Hub. Runs alongside ko.yml which pushes to GHCR.
#
# Registry split:
#   ko.yml    → ghcr.io/ntlaletsi70/blanketops-environments-controller (GHCR)
#   image.yml → docker.io/nkanyezisolutions/blanketops-environments-controller (Docker Hub)
#
# Tag strategy:
#   tag push  → {version} + latest
#   branch    → branch name only
#
# Secrets required:
#   DOCKERHUB_USERNAME — Docker Hub login
#   DOCKERHUB_TOKEN    — Docker Hub access token
#   SSH_PRIVATE_KEY    — private module git access during build
# =============================================================================

name: Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign_and_attest:
        description: "Sign and attest the image after build"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPO: docker.io/nkanyezisolutions/blanketops-environments-controller

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag strategy: version + latest on tag push; branch name only otherwise.
      - name: Compute image tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_REPO }}:${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS},${{ env.IMAGE_REPO }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}

      - name: Install cosign
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}

      - name: Attest image provenance
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Image Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🐳 Docker Hub Image Build

          **Image:** \`${{ env.IMAGE_REPO }}:${{ github.ref_name }}\`
          **Digest:** \`${{ steps.build.outputs.digest }}\`
          **Tags:** \`${{ steps.tags.outputs.tags }}\`
          **Trigger:** \`${{ github.event_name }}\`

          ## Registry split
          | Registry | Workflow | Image |
          |----------|----------|-------|
          | Docker Hub | \`image.yml\` | \`${{ env.IMAGE_REPO }}\` |
          | GHCR | \`ko.yml\` | \`ghcr.io/ntlaletsi70/blanketops-environments-controller\` |

          ## Signing and Attestation
          - Sign and attest: \`${{ github.event_name != 'workflow_dispatch' || inputs.sign_and_attest }}\`
          - Signed with Cosign (keyless via Sigstore)
          - Provenance attested via actions/attest-build-provenance
          EOF
