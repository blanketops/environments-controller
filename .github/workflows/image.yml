# =============================================================================
# image.yml — Containerfile-based Image Build → Docker Hub
#
# Builds a multi-arch controller image from Containerfile and pushes to
# Docker Hub. Runs alongside ko.yml which pushes to GHCR.
#
# Registry split:
#   ko.yml    → ghcr.io/ntlaletsi70/blanketops-environments-controller (GHCR)
#   image.yml → docker.io/nkanyezisolutions/blanketops-environments-controller (Docker Hub)
#
# Go version:
#   Extracted from go.mod at build time and passed as GO_VERSION build arg.
#   Containerfile must use: ARG GO_VERSION / FROM golang:${GO_VERSION}-alpine
#   Never hardcode the Go version in the Containerfile — go.mod is the source
#   of truth.
#
# Tag strategy:
#   tag push  → {version} + latest
#   branch    → branch name only
#
# Secrets required:
#   DOCKERHUB_USERNAME — Docker Hub login
#   DOCKERHUB_TOKEN    — Docker Hub access token
#   SSH_PRIVATE_KEY    — private module git access during build
# =============================================================================

name: Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign_and_attest:
        description: "Sign and attest the image after build"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPO: docker.io/nkanyezisolutions/blanketops-environments-controller

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract Go version from go.mod — single source of truth.
      # Passes the minor version (e.g. 1.26) as the alpine image tag.
      - name: Extract Go version from go.mod
        id: goversion
        run: |
          FULL=$(grep '^go ' go.mod | awk '{print $2}')
          MINOR=$(echo "${FULL}" | cut -d. -f1,2)
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "Go version: ${FULL} → image tag: ${MINOR}"

      # Tag strategy: version + latest on tag push; branch name only otherwise.
      - name: Compute image tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_REPO }}:${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS},${{ env.IMAGE_REPO }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.minor }}

      - name: Install cosign
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}

      # - name: Attest image provenance
      #   if: github.event_name != 'workflow_dispatch' || inputs.sign_and_attest
      #   uses: actions/attest-build-provenance@v2
      #   with:
      #     subject-name: ${{ env.IMAGE_REPO }}
      #     subject-digest: ${{ steps.build.outputs.digest }}
      #     push-to-registry: true

      - name: Image Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🐳 Docker Hub Image Build

          **Image:** \`${{ env.IMAGE_REPO }}:${{ github.ref_name }}\`
          **Digest:** \`${{ steps.build.outputs.digest }}\`
          **Tags:** \`${{ steps.tags.outputs.tags }}\`
          **Go version:** \`${{ steps.goversion.outputs.full }}\` (alpine tag: \`${{ steps.goversion.outputs.minor }}\`)
          **Trigger:** \`${{ github.event_name }}\`

          ## Registry split
          | Registry | Workflow | Image |
          |----------|----------|-------|
          | Docker Hub | \`image.yml\` | \`${{ env.IMAGE_REPO }}\` |
          | GHCR | \`ko.yml\` | \`ghcr.io/ntlaletsi70/blanketops-environments-controller\` |
          EOF
