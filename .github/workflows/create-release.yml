# Create Release — the releaser (blanketops/environments-bots, as the
# BlanketOps Environments Releaser App) checks the release and, when every
# check passes, creates release/{version} at develop's head and opens its
# pull request into main. It records each check on the Release issue
# ("Release: {version}", on project 1 as Release), opening it if Plan
# Release has not.
#
# The version input is optional: empty releases the planned Release issue,
# else the version the commits since the latest tag need. Once the branch
# is ready, run Finalize Release; the Release workflow then attaches the
# published release to the issue and closes it.
#
# Secrets required:
#   RELEASER_APP_ID, RELEASER_APP_PRIVATE_KEY — the Releaser App

name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.9); empty for the planned release"
        required: false

permissions:
  contents: read

concurrency:
  group: release-plan-and-cut
  cancel-in-progress: false

jobs:
  create:
    name: releaser cut
    runs-on: self-hosted
    steps:
      - uses: blanketops/environments-bots/.github/actions/releaser@v0.0.2
        with:
          command: cut
          release: ${{ github.event.inputs.version }}
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
