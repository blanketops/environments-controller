# Auth:
#   Uses the BlanketOps-Environments GitHub App (via
#   actions/create-github-app-token) instead of a personal-account PAT — a
#   push made with the default GITHUB_TOKEN does not trigger downstream
#   workflow runs (notably the tag push below, which release.yml listens
#   for), but an App installation token does, same as a PAT would.
#
# Docs regeneration:
#   code-docs.yml also regenerates docs/code on every push to main, but it
#   runs as a separate, asynchronously-triggered workflow. This job used to
#   merge main back into develop immediately after tagging, which raced
#   ahead of that async commit — develop never actually received it, and
#   drifted a little further from main's generated docs on every release.
#   The generate-and-commit steps below make this job self-sufficient: docs
#   are regenerated and committed to main synchronously, before merging back
#   into develop, so develop is always caught up regardless of what
#   code-docs.yml does on its own schedule.
#
# Changelog generation:
#   release.yml (triggered separately by the tag created below) used to
#   generate CHANGELOG.md and commit it to main itself — the same async
#   race as the docs one above, just for a different file. Generating and
#   committing it here instead, before tagging and before merging back into
#   develop, means develop is caught up on the changelog too, and release.yml
#   no longer needs to touch main at all — it just reads the already-current
#   CHANGELOG.md for its release notes.
#
# Verified commits:
#   Nothing here is committed or pushed with git. A commit made with
#   `git commit` in a workflow is never verified on GitHub, and a branch that
#   requires verified signatures refuses it. Merges go through the merges
#   API (hack/api-merge.sh) and file changes through createCommitOnBranch
#   (hack/api-commit.sh); GitHub makes and signs those commits itself. The
#   tag is created through the API too.
#
# Tag placement:
#   The tag is created last on main, after the changelog commit. It used to
#   be created on the code-docs commit, whose message carries [skip ci];
#   GitHub then skipped every workflow the tag should have started. Where a
#   changelog is generated it is rendered for the version with
#   `git-cliff --tag` before the tag exists.
#
# Secrets required:
#   APP_ID, APP_PRIVATE_KEY — GitHub App credentials, exchanged for a
#   short-lived installation token scoped to this repo

name: Finalize Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to finalize (e.g. v0.0.9)"
        required: true
permissions:
  contents: write
jobs:
  finalize:
    # Zenith self-hosted pool.
    runs-on: self-hosted
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-controller,environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The scripts come from the release branch, which is what is being
      # released. They are copied out of the checkout because the steps below
      # move it to main, and main does not carry them until this merge lands.
      - name: Stage the API helpers
        run: |
          for script in api-commit.sh api-merge.sh; do
            git show "origin/release/${VERSION}:hack/${script}" > "${RUNNER_TEMP}/${script}"
            chmod +x "${RUNNER_TEMP}/${script}"
          done

      - name: Merge release into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          "${RUNNER_TEMP}/api-merge.sh" main "release/${VERSION}" \
            "release: merge release/${VERSION} into main"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/blanketops/*
          go env -w GONOSUMDB=github.com/blanketops/*
          go env -w GOPROXY=direct

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate code docs
        run: |
          mkdir -p docs/code
          gomarkdoc \
            --output 'docs/code/{{.Dir}}.md' \
            ./internal/... \
            ./pkg/...

      - name: Commit code docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          "${RUNNER_TEMP}/api-commit.sh" main \
            "docs: auto-generate code documentation [skip ci]" docs/code/

      - name: Install git-cliff
        run: |
          GITCLIFF_VERSION="2.13.0"
          curl -L "https://github.com/orhun/git-cliff/releases/download/v${GITCLIFF_VERSION}/git-cliff-${GITCLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar xzf git-cliff.tar.gz
          sudo mv "git-cliff-${GITCLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          rm -rf git-cliff.tar.gz "git-cliff-${GITCLIFF_VERSION}"
          git-cliff --version

      # --tag renders the commits since the last release under this version:
      # the tag itself is only created after this file is committed.
      - name: Generate CHANGELOG.md
        run: git-cliff --config .cliff.toml --tag "${VERSION}" --output CHANGELOG.md

      - name: Commit changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          "${RUNNER_TEMP}/api-commit.sh" main \
            "chore(release): update changelog for ${VERSION}" CHANGELOG.md

      # On the changelog commit, not the [skip ci] docs commit before it: a tag
      # on a [skip ci] commit starts no workflow.
      - name: Tag release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sha=$(git rev-parse HEAD)
          jq -n --arg ref "refs/tags/${VERSION}" --arg sha "$sha" '{ref: $ref, sha: $sha}' \
            | curl -sS --fail-with-body -X POST \
                -H "Authorization: bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                --data-binary @- \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs" >/dev/null
          echo "Tagged ${sha} as ${VERSION}"

      - name: Merge main back into develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          "${RUNNER_TEMP}/api-merge.sh" develop main \
            "chore: sync develop with main after release/${VERSION}"

      # A branch rule may forbid deleting release branches. The release is
      # complete either way, so a refusal is reported, not failed on.
      - name: Delete release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/release/${VERSION}")
          if [ "$status" = 204 ]; then
            echo "Deleted release/${VERSION}"
          else
            echo "::warning::release/${VERSION} was not deleted (HTTP ${status}); a branch rule may protect it"
          fi

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🎉 Release Finalized **Version:** \`${{ github.event.inputs.version }}\` 
          ## Completed 
          - Merged \`release/${{ github.event.inputs.version }}\` into \`main\` 
          - Created Git tag \`${{ github.event.inputs.version }}\` 
          - Synced \`main\` back into \`develop\`
          - Deleted release branch 
          ## Branch Flow 
          -  release/${{ github.event.inputs.version }} ↓ main ↓ develop 
          ## Release Tag \`${{ github.event.inputs.version }}\` 
          ## Next Steps
          - Pushing the tag triggers the **Release** workflow which generates the changelog and GitHub Release. 
          EOF
