# =============================================================================
# sync-rbac.yml — Sync the manager RBAC role into environments-install (admin bot)
#
# Propagates config/rbac/role.yaml (the manager ClusterRole, generated by
# `mage Manifests` and committed here as the cross-repo contract) into
# blanketops/environments-install config/rbac through the admin bot of
# environments-bots. The bot writes as the BlanketOps Environments Admin App: a
# GitHub-signed commit on a sync/* branch, a pull request into install's main,
# merged as a merge commit, so install's protect ruleset accepts it with no
# bypass. It only writes the files in config/rbac here (role.yaml) and never
# deletes install's other RBAC files; when install already matches, it opens
# nothing.
#
# Triggers: a v* tag push (syncs that release; finalize-release creates the tag
# with an App token, so the push starts workflows), or manual dispatch (syncs
# the dispatched ref; dry-run, on by default, reports what would change
# without writing). Not `release: published`: release.yml publishes with
# GITHUB_TOKEN, whose events start no other workflows.
#
# Secrets/variables: ADMIN_APP_PRIVATE_KEY (secret) and ADMIN_CLIENT_ID
# (variable) of the Admin App, which needs Contents and Pull requests: write
# on environments-install. The admin binary is downloaded from the
# environments-bots release and verified with cosign before it runs.
# =============================================================================
name: Sync RBAC into environments-install
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Read only: report what would change, write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: admin-sync-rbac
  cancel-in-progress: false

jobs:
  sync-rbac:
    name: admin sync (RBAC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: admin sync
        uses: blanketops/environments-bots/.github/actions/admin@v0.1.1
        with:
          source-dir: config/rbac
          dest-path: config/rbac
          label: "RBAC from environments-controller ${{ github.ref_name }}"
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}
          client-id: ${{ vars.ADMIN_CLIENT_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
