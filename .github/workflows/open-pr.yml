# =============================================================================
# open-pr.yml — Open a pull request + tracking issue on a branch's first push
#
# On a push to a feature branch, the developer bot opens a pull request into
# develop and a one-to-one tracking issue (labelled pr-tracking plus the
# branch's Conventional Commit type) if the branch has none yet. It is
# idempotent, so later pushes to the same branch do nothing.
# 
# Trigger scope:
#   push to any branch except the long-lived ones (main, develop, release/**,
#   sync/**), which the developer bot skips anyway.
# 
# Secrets required:
#   DEVELOPER_APP_ID, DEVELOPER_APP_PRIVATE_KEY — Developer App credentials
# =============================================================================
name: Open PR

on:
  push:
    branches-ignore:
      - main
      - develop
      - 'release/**'
      - 'sync/**'

permissions:
  contents: read

jobs:
  open:
    name: open the pull request and tracking issue
    runs-on: self-hosted
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7

      - name: Generate Developer App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: ${{ github.event.repository.name }}

      - name: Open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: developer open -base develop
